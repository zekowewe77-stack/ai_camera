name: ai_camera
description: "A new Flutter camera application with AI capabilities and video support."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # المكتبات الخاصة بالكاميرا والميديا والمعرض
  camera: ^0.10.5+9
  permission_handler: ^11.3.1
  gal: ^2.3.0
  path_provider: ^2.1.2
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true