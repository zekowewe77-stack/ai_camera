name: camera_ai_app
description: "AI Camera Pro 2027 application with advanced zoom, background processing, and photo gallery."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  permission_handler: ^11.3.0
  gal: ^2.2.1
  image: ^4.1.3
  photo_manager: ^3.0.0
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true